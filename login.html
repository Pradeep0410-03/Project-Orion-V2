<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<script src="script.js"></script>

<style>
*{
    box-sizing: border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family: Arial, sans-serif;
    background-image:url("https://images.unsplash.com/photo-1763236390948-fcc866ddb17a?w=1600");
    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    color:#e6e6e6;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}


nav{
    position:fixed;
    top:15px;
    left:15px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:10px 20px;
    background:rgba(0,0,0,0.75);
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.6);
}

nav img{
    height:35px;
    border-radius:6px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:16px;
}

nav a:hover{
    text-decoration:underline;
}

/* 🔹 CENTER CONTAINER */
.container{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:32px 16px;
}


header{
    background:rgba(0,0,0,0.6);
    color:white;
    padding:15px 30px;
    margin-bottom:20px;
    border-radius:8px;
    font-size:24px;
}


form{
    width:340px;
    background:rgba(0,0,0,0.75);
    padding:30px;
    border-radius:12px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
}

label{
    display:block;
    margin-top:12px;
    font-size:14px;
    letter-spacing:0.2px;
}

input{
    width:100%;
    margin-top:6px;
    padding:9px;
    border:1px solid rgba(255,255,255,0.25);
    border-radius:5px;
    background:rgba(255,255,255,0.12);
    color:#f7f7f7;
    transition:border 0.15s ease, background 0.15s ease;
}

/* 🔹 Input focus UX */
input:focus{
    outline:none;
    border:2px solid #4CAF50;
    background:#222;
    color:white;
}

/* 🔹 Helpers */
.hint{
    margin-top:6px;
    font-size:12px;
    color:#bdbdbd;
}

.form-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:14px;
    font-size:13px;
}

.link{
    color:#8bc34a;
    text-decoration:none;
}

.link:hover{
    text-decoration:underline;
}

.password-wrap{
    position:relative;
}

.toggle-btn{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#e0e0e0;
    cursor:pointer;
    font-size:12px;
    padding:4px 6px;
}

.toggle-btn:focus{
    outline:2px solid #4CAF50;
}

/* 🔹 Buttons */
.buttons{
    margin-top:18px;
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    padding:10px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:0.3px;
}

.btn-primary{
    background:#4CAF50;
    color:white;
}

.btn-primary:hover{
    background:#43a047;
}

.btn-ghost{
    background:transparent;
    border:1px solid rgba(255,255,255,0.2);
    color:#f0f0f0;
}

.btn-ghost:hover{
    background:rgba(255,255,255,0.08);
}

/* 🔹 FOOTER */
footer{
    background:rgba(0,0,0,0.9);
    color:white;
    text-align:center;
    padding:15px;
    font-size:14px;
}

/* 🔹 RESPONSIVE */
@media (max-width:768px){
    form{
        width:90%;
    }
    nav{
        flex-direction:column;
        gap:8px;
    }
}
</style>
</head>

<body>


    
<nav>
    <img src="notion.jpeg" alt="Logo">
    <a href="#">Home</a>
    <a href="#">About</a>
</nav>


<div class="container">
<header>LOG IN YOUR ACCOUNT</header>

<form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required aria-required="true">

    <label for="password">Password</label>
    <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required aria-required="true">
        <button type="button" class="toggle-btn" aria-label="Toggle password visibility" id="togglePassword">Show</button>
    </div>
    <div class="hint">Use 8+ characters with letters and numbers.</div>

    <div class="form-row">
        <label style="margin-top:0;">
            <input type="checkbox" id="remember" name="remember"> Remember me
        </label>
        <a class="link" href="#">Forgot password?</a>
    </div>

    <div class="buttons">
        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
        <button type="reset" class="btn btn-ghost">Reset</button>
    </div>
</form>
</div>


<footer>
    📧 Email: tiwaripradeep9575@gmail.com |
    📞 Contact: +91 98765 43210 |
    <a class="link" href="#" style="color:#cddc39;">Privacy</a> ·
    <a class="link" href="#" style="color:#cddc39;">Terms</a>
</footer>

<script>
// Toggle password visibility
const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("togglePassword");
toggleBtn.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    toggleBtn.textContent = isHidden ? "Hide" : "Show";
    passwordInput.focus();
});

// Basic submit UX (demo only)
const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
form.addEventListener("submit", (e) => {
    if (!form.checkValidity()) return; // let browser show native validation
    e.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    setTimeout(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        alert("Demo only: connect to backend for real login.");
    }, 1200);
});
</script>
</body>
</html>
